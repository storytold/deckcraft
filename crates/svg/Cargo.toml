[package]
name = "deckcraft-svg"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Rasterize SVG pictures for slides and for the PNG PowerPoint keeps beside an icon"

[lints]
workspace = true

[dependencies]
flate2 = "1.1.10"
image = { workspace = true }
# No system-font or memmap features: those need fontconfig and do not build for wasm.
resvg = { version = "0.48.1", default-features = false, features = ["text", "raster-images", "svgz"] }
