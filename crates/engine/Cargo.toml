[package]
name = "deckcraft-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "DeckCraft engine: sessions, undo history, selection, the command registry every frontend dispatches through, and pointer tools"

[lints]
workspace = true

[dependencies]
deckcraft-geom = { workspace = true }
deckcraft-color = { workspace = true }
deckcraft-model = { workspace = true }
deckcraft-plugin = { workspace = true }
deckcraft-collab = { workspace = true }
deckcraft-fonts = { workspace = true }
deckcraft-text = { workspace = true }
deckcraft-render = { workspace = true }
deckcraft-pdf = { workspace = true }
deckcraft-format = { workspace = true }
deckcraft-pptx = { workspace = true }
deckcraft-media = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
i_overlay = { workspace = true }
thiserror = { workspace = true }
log = { workspace = true }
image = { workspace = true }

[dev-dependencies]
deckcraft-anim = { workspace = true }
zip = { workspace = true }
# The fake craft-live room in the live client's tests keeps a plain Yjs document, as the server does.
yrs = "0.28"

# The browser clock for comment timestamps (wasm has no std::time::SystemTime).
[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"

# tests/live_wasm.rs: the craft-live client in wasm32 (wasm-bindgen-test-runner).
[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3"

# Add-ins and macros against a real child process: the test binary serves as the add-in, so it
# runs without libtest's harness (standard output is the protocol's alone).
[[test]]
name = "addins"
harness = false

# Runs without libtest: the test binary doubles as the add-ins whose requirements it checks.
[[test]]
name = "plugin_requires"
harness = false

# Runs without libtest: the test binary doubles as the co-editing transport it starts.
[[test]]
name = "collab_push"
harness = false

# Runs without libtest: the test binary doubles as the two DeckCraft peers it starts.
[[test]]
name = "collab_loopback"
harness = false
