[package]
name = "deckcraft-collab-web"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "DeckCraft's browser collaboration link: the cabinet's session over the page's WebSocket and the media channel over fetch"
rust-version.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
deckcraft-collab = { workspace = true }
deckcraft-collab-proto = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
deckcraft-engine = { workspace = true }
js-sys = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
    "Window",
    "Event",
    "EventTarget",
    "MessageEvent",
    "CloseEvent",
    "WebSocket",
    "BinaryType",
    "Headers",
    "Request",
    "RequestInit",
    "RequestMode",
    "Response",
] }
