[package]
name = "deckcraft-collab"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "DeckCraft co-editing (plugin protocol 2): the presentation as a Yjs document (schema 1), end-to-end encryption, awareness"

[lints]
workspace = true

[dependencies]
deckcraft-model = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }
yrs = { version = "0.28", features = ["sync"] }
aes-gcm = { version = "0.10", default-features = false, features = ["aes", "alloc"] }
base64 = "0.22"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
getrandom = "0.2"
