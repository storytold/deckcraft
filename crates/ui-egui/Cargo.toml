[package]
name = "deckcraft-ui-egui"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "DeckCraft egui frontend (PowerPoint-style UI); swappable — nothing below depends on it"

[lints]
workspace = true

[dependencies]
deckcraft-geom = { workspace = true }
deckcraft-color = { workspace = true }
deckcraft-model = { workspace = true }
deckcraft-fonts = { workspace = true }
deckcraft-text = { workspace = true }
deckcraft-render = { workspace = true }
deckcraft-anim = { workspace = true }
deckcraft-engine = { workspace = true }
deckcraft-media = { workspace = true }
egui = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"

# Linux only, where winit reports no system theme: the desktop portal's light/dark answer
# (see `desktop_theme.rs`). Already in the tree, with these features, through egui's own
# accessibility bus; pinned to one version so nothing is built twice.
[target.'cfg(target_os = "linux")'.dependencies]
zbus = "=5.19.0"

[dev-dependencies]
egui_kittest = { workspace = true, features = ["wgpu", "snapshot"] }

[build-dependencies]
serde_json = { workspace = true }
toml = "1"
