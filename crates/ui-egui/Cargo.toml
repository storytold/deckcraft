[package]
name = "deckcraft-ui-egui"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "DeckCraft egui frontend (PowerPoint-style UI); swappable — nothing below depends on it"

[lints]
workspace = true

[features]
# File > Print > Network printer (WS-Print and IPP). On by default; build with --no-default-features to
# leave the destination, its code and craft-print's `wsd` and `ipp` backends out. Web builds (wasm32)
# never have it: there is no socket to open (build.rs turns the feature and the target into the
# `network_print` cfg). Nothing connects until a printer's address is queried or a job is confirmed.
default = ["network-print"]
network-print = ["craft-print/wsd", "craft-print/ipp"]

[dependencies]
deckcraft-geom = { workspace = true }
deckcraft-color = { workspace = true }
deckcraft-model = { workspace = true }
deckcraft-fonts = { workspace = true }
deckcraft-text = { workspace = true }
deckcraft-render = { workspace = true }
deckcraft-anim = { workspace = true }
deckcraft-engine = { workspace = true }
deckcraft-media = { workspace = true }
craft-ui = { workspace = true }
craft-print = { workspace = true }
egui = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"

[dev-dependencies]
# The in-process fake WS-Print printer for the network print tests (`craft_print::wsd::testing`).
craft-print = { workspace = true, features = ["wsd", "ipp", "testing"] }
egui_kittest = { workspace = true, features = ["wgpu", "snapshot"] }

[build-dependencies]
serde_json = { workspace = true }
toml = "1"
