[package]
name = "deckcraft-fonts"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "DeckCraft fonts: font database (craft-fonts + system), substitutes for Office fonts, metrics, outlines, shaping"

[features]
# For embedders whose document policy permits only attributed bundled font files.
# Cargo unifies this feature across DeckCraft's font, text, render and PDF crates.
bundled-fonts-only = []

[lints]
workspace = true

[dependencies]
kurbo = { workspace = true }
skrifa = { workspace = true }
harfrust = { workspace = true }
unicode-bidi = { workspace = true }
log = { workspace = true }
# Last-resort face only (Ubuntu Light); no UI code.
epaint_default_fonts = "0.37"
