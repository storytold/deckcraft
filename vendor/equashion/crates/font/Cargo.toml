[package]
name = "equashion-font"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "equaSHion fonts: font database (bundled OFL + optional system fonts), metrics, glyph outlines, shaping"

[lints]
workspace = true

[features]
default = ["extra-fonts"]
# Compatibility flag; DeckCraft supplies its approved fonts in every configuration.
extra-fonts = []

[dependencies]
kurbo = { workspace = true }
skrifa = { workspace = true }
harfrust = { workspace = true }
unicode-bidi = { workspace = true }
log = { workspace = true }

deckcraft-fonts.workspace = true
epaint_default_fonts.workspace = true
