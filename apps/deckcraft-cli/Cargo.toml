[package]
name = "deckcraft-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "DeckCraft on the command line: render, convert, run commands, inspect, and serve MCP"
publish = false

[lints]
workspace = true

[features]
default = ["video"]
video = ["deckcraft-engine/video", "deckcraft-mcp/video"]

[[bin]]
name = "deckcraft-cli"
path = "src/main.rs"

[dependencies]
deckcraft-engine = { workspace = true, default-features = false }
deckcraft-mcp = { workspace = true, default-features = false }
serde_json = { workspace = true }

[dev-dependencies]
zip = { workspace = true }
