<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>DeckCraft</title>
  <link data-trunk rel="rust" data-bin="deckcraft-web" data-wasm-opt="z" data-weak-refs />
  <link data-trunk rel="icon" href="../../assets/app-icon/deckcraft.ico" />
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #262626; }
    #deckcraft_canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
    #deckcraft_loading { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
      color: #b8b8b8; font: 14px system-ui, sans-serif; pointer-events: none; }
  </style>
</head>
<body>
  <canvas id="deckcraft_canvas"></canvas>
  <div id="deckcraft_loading">Loading DeckCraft&hellip;</div>
  <script>
    // DeckCraft is built with WebAssembly SIMD (Chrome and Edge 91+, Firefox 89+, Safari 16.4+).
    // Say so instead of failing silently in a browser without it. The bytes are a module with
    // one function returning `i8x16.splat(0)`.
    (function () {
      var simd = new Uint8Array([0, 97, 115, 109, 1, 0, 0, 0, 1, 5, 1, 96, 0, 1, 123, 3, 2, 1, 0, 10, 8, 1, 6, 0, 65, 0, 253, 15, 11]);
      var ok = typeof WebAssembly === "object" && WebAssembly.validate(simd);
      if (!ok) {
        document.getElementById("deckcraft_loading").textContent =
          "DeckCraft needs a browser with WebAssembly SIMD: Chrome or Edge 91, Firefox 89, Safari 16.4 or later.";
      }
    })();
  </script>
</body>
</html>
