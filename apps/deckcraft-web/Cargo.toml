[package]
name = "deckcraft-web"
description = "DeckCraft in the browser (eframe web runner, WebGPU with WebGL2 fallback)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[[bin]]
name = "deckcraft-web"
path = "src/main.rs"

[dependencies]
deckcraft-engine = { workspace = true }
deckcraft-ui-egui = { workspace = true }
# The page command API (storytold/craft-libs#413): window.deckcraft over the control channel.
craft-web-api = { git = "https://github.com/storytold/craft-libs", rev = "fd5e2feff6ea25bed371a99cc732b3968d621505", version = "0.1.0" }
# The web collaboration session the host bridge opens.
deckcraft-collab-web = { workspace = true }
# The host messages (craft-libs): one contract and one bridge for the web builds.
# The collaboration messages (`session`, `session-state`, `presence`, `commit`, `committed`) are
# on the `feat/collab-session-messages` branch, not yet in `storytold/craft-libs`; ADR-0016 §3
# pins the fork revision until that merges.
craft-web-host = { git = "https://github.com/copoka/craft-libs", rev = "7666e2b100d8cf12998f9b57d3b036964cc3189c", version = "0.1.0" }
egui = { workspace = true }
log = { workspace = true }
serde_json = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
# `wgpu` pulls egui-wgpu's defaults: WebGPU plus the WebGL2 fallback.
eframe = { workspace = true, features = ["default_fonts", "wgpu", "accesskit"] }
rfd = { workspace = true }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Window", "Document", "Element", "HtmlElement", "HtmlCanvasElement", "HtmlAnchorElement", "Blob", "BlobPropertyBag", "Url", "Location", "CssStyleDeclaration", "MessageEvent", "Event", "EventTarget", "UrlSearchParams"] }

[dev-dependencies]
# The headless host-page scenario drives a real in-process sync server.
deckcraft-collab = { workspace = true }
deckcraft-collab-proto = { workspace = true }
