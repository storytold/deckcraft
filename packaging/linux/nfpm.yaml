# .deb and .rpm packages (nfpm: https://nfpm.goreleaser.com). Run by package.sh, which stages
# the file tree, substitutes its path for ${STAGE} (nfpm doesn't expand env vars in `src`) and
# exports VERSION and NFPM_ARCH.
#
#   nfpm package -f packaging/linux/nfpm.yaml -p deb -t dist/release/
name: ${NFPM_NAME}
arch: ${NFPM_ARCH}
platform: linux
version: ${VERSION}
# semver: 0.2.0-rc.1 becomes 0.2.0~rc.1 in deb/rpm, so pre-releases sort before the release.
version_schema: semver
release: 1
section: editors
priority: optional
maintainer: ${DECKCRAFT_MAINTAINER}
vendor: Learning Machines LLC
homepage: https://getartcraft.com/apps/deckcraft
license: MIT OR Apache-2.0
description: |-
  Open-source, native presentation app that works the way PowerPoint users
  expect. Themes, layouts, shapes, pictures, tables, charts, transitions and
  animations; opens and saves PowerPoint (.pptx) files; full-screen slide show
  with presenter view; GPU rendering (wgpu).
  Includes deckcraft-cli, a headless renderer and command runner.

# The binaries link only glibc and libgcc_s directly. Windowing (X11/Wayland, xkbcommon) and the
# GPU (Vulkan, EGL/GL) are loaded at runtime, so they are dependencies/recommendations here
# rather than ELF NEEDED entries.
overrides:
  deb:
    depends:
      - libc6 (>= 2.35)
      - libgcc-s1
      - libxkbcommon0
      - libasound2 | libasound2t64
      - libvulkan1 | libegl1
    recommends:
      - libwayland-client0
      - libx11-6
      - libx11-xcb1
      - libxcursor1
      - libxi6
      - libxrandr2
      - mesa-vulkan-drivers
      - xdg-desktop-portal
  rpm:
    depends:
      - libxkbcommon
      - alsa-lib
      - (vulkan-loader or libglvnd-egl)
    recommends:
      - libwayland-client
      - libX11
      - libXcursor
      - libXi
      - libXrandr
      - mesa-vulkan-drivers
      - xdg-desktop-portal

contents:
  - src: ${STAGE}/usr/bin/${NFPM_BIN}
    dst: /usr/bin/${NFPM_BIN}
    file_info: { mode: 0755 }
  - src: ${STAGE}/usr/bin/${NFPM_CLI}
    dst: /usr/bin/${NFPM_CLI}
    file_info: { mode: 0755 }
  - src: ${STAGE}/usr/lib/
    dst: /usr/lib/
    type: tree
  - src: ${STAGE}/usr/share/
    dst: /usr/share/
    type: tree
  # Debian's zsh reads vendor-completions, not /usr/share/zsh/site-functions as Fedora's and
  # openSUSE's do (its debian/rules sets --enable-additional-fpath).
  - src: /usr/share/zsh/site-functions/_deckcraft-cli
    dst: /usr/share/zsh/vendor-completions/_deckcraft-cli
    type: symlink
    packager: deb

scripts:
  postinstall: packaging/linux/postinst.sh
  postremove: packaging/linux/postinst.sh
